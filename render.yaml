# Render Blueprint (https://render.com/docs/blueprint-spec)
# Lives at the repository root; rootDir points Render at the Level 3 app.
services:
  - type: web
    name: taskflow
    runtime: node
    rootDir: level-3
    plan: free
    buildCommand: cd client && npm ci --include=dev && npm run build && cd ../server && npm ci --omit=dev
    startCommand: cd server && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # paste your MongoDB Atlas connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: SEED
        value: "true" # creates demo accounts on first boot; set to "false" afterwards
